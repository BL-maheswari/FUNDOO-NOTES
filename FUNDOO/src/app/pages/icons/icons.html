<div class="toolbar">

  <button (click)="onClick('format')" title="Format">
    <span class="material-icons">format_bold</span>
  </button>

  <button (click)="onClick('color')" title="Background">
    <span class="material-icons">palette</span>
  </button>

  <button (click)="onClick('reminder')" title="Reminder">
    <span class="material-icons">notifications</span>
  </button>

  <button (click)="onClick('collaborator')" title="Collaborator">
    <span class="material-icons">person_add</span>
  </button>

  <button (click)="onClick('image')" title="Add Image">
    <span class="material-icons">image</span>
  </button>

  <button (click)="onClick('archive')" title="Archive">
    <span class="material-icons">archive</span>
  </button>

  <button (click)="onClick('more')" title="More">
    <span class="material-icons">more_vert</span>
  </button>

  <button (click)="onClick('undo')" title="Undo">
    <span class="material-icons">undo</span>
  </button>

  <button (click)="onClick('redo')" title="Redo">
    <span class="material-icons">redo</span>
  </button>

</div>
