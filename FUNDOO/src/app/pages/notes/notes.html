<!-- TOGGLE BUTTON -->
<button (click)="toggleView()">Toggle View</button>

<!-- COLLAPSED NOTE -->
@if (!isExpanded) {
  <div class="note-collapsed" (click)="expandNote()">
    <span class="placeholder">Take a note...</span>

    <div class="note-actions">
      <span>✔️</span>
      <span>🎨</span>
      <span>🖼️</span>
    </div>
  </div>
}

<!-- EXPANDED NOTE -->
@if (isExpanded) {

  <!-- OVERLAY -->
  <div class="overlay" (click)="closeNote()"></div>

  <!-- NOTE FORM -->
  <form class="note-expanded"
        [formGroup]="noteForm"
        (click)="$event.stopPropagation()">

    <input type="text"
           placeholder="Title"
           class="title-input"
           formControlName="title" />

    <textarea placeholder="Take a note..."
              class="note-text"
              formControlName="description">
    </textarea>

    <div class="note-bottom-row">

      <!-- COLOR TOOLBAR (CREATE NOTE COLOR) -->
      <app-icon-toolbar
        (colorChange)="noteForm.patchValue({ color: $event })">
      </app-icon-toolbar>

      <button type="button" class="close-btn" (click)="createNote()">
        Close & Save
      </button>

    </div>

  </form>
}

<!-- NOTES LIST -->
<div class="notes-container"
     [ngClass]="(isListView$ | async) ? 'list-view' : 'grid-view'">

  @for (note of notes || []; track note.id) {

    <div class="note-card"
         [class.list-card]="(isListView$ | async)"
         [style.background-color]="note.color">

      <div class="note-title">{{ note.title }}</div>
      <div class="note-content">{{ note.description }}</div>

      <div class="note-toolbar" (click)="$event.stopPropagation()">

        <!-- EXISTING NOTE COLOR TOOLBAR -->
        <app-icon-toolbar
          [note]="note"
          (refresh)="getNotes()"
          (colorChange)="changeColor(note, $event)">
        </app-icon-toolbar>

      </div>

    </div>

  }

</div>
